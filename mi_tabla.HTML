<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Reserva de Hoteles</title>
    <style>
        /* Aplica el fondo gris */
        body {
            background-color: #f0f0f0;
            margin: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: black;
        }
        h1 {
            font-size: 3em;
            margin-bottom: 40px;
        }
        button {
            font-size: 1.2em;
            margin: 10px;
            padding: 10px 20px;
            border: none;
            background-color: #4a4a4a;
            color: white;
            cursor: pointer;
            border-radius: 5px;
            transition: background-color 0.3s;
        }
        button:hover {
            background-color: #6a6a6a;
        }
        table {
            margin-top: 20px;
            border-collapse: collapse;
            width: 80%;
        }
        th, td {
            border: 1px solid #dddddd;
            text-align: left;
            padding: 8px;
        }
        tr:nth-child(even) {
            background-color: #dddddd;
        }
    </style>
</head>
<body>
    <h1>Reserva de Hoteles</h1>

    <!-- Formulario de Consulta SQL -->
    <form action="/consultar" method="POST" id="sql-form">
        <label for="consulta">Consulta SQL:</label>
        <input type="text" id="consulta" name="consulta" required>
        <button type="submit">Ejecutar Consulta</button>
    </form>

    <!-- Espacio para Mostrar Resultados -->
    <div id="resultado">
        <h2>Resultados de la Consulta:</h2>
        <pre id="resultado-json"></pre>
    </div>

    <script>
        // Captura el envío del formulario para mostrar los resultados directamente
        document.getElementById('sql-form').addEventListener('submit', async function(event) {
            event.preventDefault();
            const formData = new FormData(this);
            const response = await fetch('/consultar', {
                method: 'POST',
                body: formData
            });
            const data = await response.json();
            document.getElementById('resultado-json').innerText = JSON.stringify(data, null, 2);
        });
    </script>

</body>
</html>
